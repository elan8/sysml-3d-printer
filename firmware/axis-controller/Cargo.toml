# The motion controller of one axis as firmware for Run42's WebAssembly guest interface (ABI version 2): a trapezoidal
# move, an optional zero-vibration input shaper, microstep quantisation and a drive.
# The drive is an open-loop stepper (the default), a closed-loop stepper (`closed_loop`) or a brushless servo (`servo`).
# The features `shaper*` choose the frequency of the shaper in Hz (none by default).
[workspace]

[package]
name = "axis_controller"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
closed_loop = []
corexy = ["closed_loop"]
corexy_x = ["corexy"]
corexy_y = ["corexy"]
corexy_opposite = ["corexy"]
corexy_corner = ["corexy"]
servo = []
shaper6150 = []
shaper6208 = []
shaper6350 = []
shaper6902 = []

[profile.release]
opt-level = 3
panic = "abort"
lto = true
