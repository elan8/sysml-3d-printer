  <title id="title">Lead printer architecture</title>
  <desc id="desc">The motion control subsystem takes a sliced job and commands the closed-loop motor drive, high-flow hotend and heated bed. Encoder and temperature feedback return to control. The drive moves the CoreXY structure. A 600 watt supply powers the motor drive, hotend and heated bed (and the control board).</desc>
  <defs>
    <marker id="command" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#0b7181"/>
    </marker>
    <marker id="mechanical" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#963d15"/>
    </marker>
    <marker id="power" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#8a6100"/>
    </marker>
  </defs>
  <rect width="960" height="579" fill="#fff"/>
  <rect x="12" y="12" width="936" height="555" rx="16" fill="#f2f6f8" stroke="#b9cbd3"/>
  <g font-family="DejaVu Sans, Arial, sans-serif" fill="#173143">
    <text x="36" y="48" font-size="25" font-weight="700">Lead printer architecture</text>
    <text x="924" y="48" text-anchor="end" font-size="16" fill="#425c6a">CoreXYClosedShaped</text>
    <rect x="43" y="91" width="184" height="53" rx="9" fill="#fff" stroke="#bdcdd5"/>
    <text x="135" y="123" text-anchor="middle" font-size="17" font-weight="700">Sliced print job</text>
    <rect x="312" y="80" width="336" height="74" rx="10" fill="#123747"/>
    <text x="480" y="111" fill="#fff" text-anchor="middle" font-size="21" font-weight="700">Motion control</text>
    <text x="480" y="136" fill="#d6e9ee" text-anchor="middle" font-size="16">32-bit · shaping · thermal monitoring</text>
    <g fill="none" stroke="#0b7181" stroke-width="2" marker-end="url(#command)">
      <path d="M227 117H310"/>
      <path d="M342 154V176H80V269"/>
      <path d="M408 154V269"/>
      <path d="M621 154V176H696V269"/>
    </g>
    <g fill="none" stroke="#0b7181" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#command)">
      <path d="M265 269V191H376V155"/>
      <path d="M551 269V155"/>
      <path d="M881 269V191H583V155"/>
    </g>
    <g fill="#234a58" font-size="15" text-anchor="middle">
      <text x="172" y="223">Motor commands</text>
      <text x="172" y="244">Encoder feedback</text>
      <text x="480" y="223">Heater output</text>
      <text x="480" y="244">Temperature</text>
      <text x="788" y="223">Heater output</text>
      <text x="788" y="244">Temperature</text>
    </g>
    <g fill="#fff" stroke="#bdcdd5">
      <rect x="36" y="270" width="270" height="83" rx="10"/>
      <rect x="345" y="270" width="270" height="83" rx="10"/>
      <rect x="654" y="270" width="270" height="83" rx="10"/>
      <rect x="36" y="428" width="270" height="82" rx="10"/>
      <rect x="345" y="428" width="579" height="82" rx="10"/>
    </g>
    <g text-anchor="middle">
      <g font-size="20" font-weight="700">
        <text x="171" y="303">Motor drive</text>
        <text x="480" y="303">Hotend</text>
        <text x="789" y="303">Heated bed</text>
        <text x="171" y="461">Motion structure</text>
        <text x="634" y="461">Power supply</text>
      </g>
      <g font-size="17" fill="#425c6a">
        <text x="171" y="329">Closed-loop steppers</text>
        <text x="480" y="329">High flow · 80 W heater</text>
        <text x="789" y="329">400 W heater</text>
        <text x="171" y="487">CoreXY · extrusion frame</text>
        <text x="634" y="487">600 W for drive, hotend, bed and control</text>
      </g>
    </g>
    <path d="M151 353V426" fill="none" stroke="#963d15" stroke-width="2.5" marker-end="url(#mechanical)"/>
    <text x="166" y="397" font-size="16" fill="#793309">Belt motion</text>
    <g fill="none" stroke="#8a6100" stroke-width="2.5" marker-end="url(#power)">
